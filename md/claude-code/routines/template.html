<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>AI Daily Digest {{DATE}}</title>
<style>
  /* md-to-doc の corporate テーマを移植。
     Gmail は CSS カスタムプロパティ(var())に非対応なので、hex をインライン style に
     焼き込み、ダークモードはこのブロックのクラス上書きで対応する。
     この style ブロックを解釈しないクライアントでも、インライン値がライト配色として効く。 */
  @media (prefers-color-scheme: dark) {
    .bg       { background-color: #0e1420 !important; }
    .card     { background-color: #161d2b !important; border-color: #26303f !important; }
    .text     { color: #e6ecf5 !important; }
    .muted    { color: #9aa6b8 !important; }
    .line     { border-color: #26303f !important; }
    .soft     { background-color: #16213a !important; }
    .chip     { background-color: #16213a !important; color: #e6ecf5 !important; border-color: #26303f !important; }
    .statnum  { color: #5b9bff !important; }
    .a0t      { color: #5b9bff !important; }
    .a1t      { color: #38bdf8 !important; }
    .a2t      { color: #8b8cf7 !important; }
    .a3t      { color: #2dd4bf !important; }
    .a0b      { border-color: #5b9bff !important; }
    .a1b      { border-color: #38bdf8 !important; }
    .a2b      { border-color: #8b8cf7 !important; }
    .a3b      { border-color: #2dd4bf !important; }
    .link     { color: #5b9bff !important; }
    .banner   { background-color: #16305e !important; background-image: linear-gradient(135deg,#16305e,#0f1c38) !important; }
    .bannerfg { color: #eaf1ff !important; }
  }
  @media only screen and (max-width: 620px) {
    .wrap { width: 100% !important; }
    .pad  { padding-left: 20px !important; padding-right: 20px !important; }
  }
  a { text-decoration: none; }
</style>
</head>
<body class="bg" style="margin:0; padding:0; background-color:#f7f9fc;">

<div style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all;">{{PREHEADER}}</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="bg" style="background-color:#f7f9fc;">
<tr><td align="center" style="padding:24px 12px 32px 12px;">

  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" class="wrap" style="width:600px; max-width:600px;">

    <!-- banner -->
    <tr><td class="banner" bgcolor="#1a56db" style="background-color:#1a56db; background-image:linear-gradient(135deg,#1a56db,#1e40af); border-radius:14px 14px 0 0;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr><td class="pad" style="padding:22px 32px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
          <td class="bannerfg" style="font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif; font-size:19px; font-weight:700; letter-spacing:-0.01em; color:#ffffff;">AI Daily Digest</td>
          <td class="bannerfg" align="right" style="font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif; font-size:13px; color:#ffffff; opacity:0.85;">{{DATE}}</td>
        </tr></table>
      </td></tr>
      </table>
    </td></tr>

    <!-- card -->
    <tr><td class="card line" style="background-color:#ffffff; border:1px solid #e5e7eb; border-top:none; border-radius:0 0 14px 14px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

      <!-- lead -->
      <tr><td class="pad" style="padding:28px 32px 0 32px;">
        <p class="text" style="margin:0; font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif; font-size:15.5px; line-height:1.85; color:#1f2937; font-weight:500;">{{SUMMARY}}</p>
      </td></tr>

      <!-- stats -->
      <tr><td class="pad" style="padding:20px 32px 0 32px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>{{STATS}}</tr></table>
      </td></tr>

      <!-- chips -->
      <tr><td class="pad" style="padding:16px 32px 0 32px;">{{CHIPS}}</td></tr>

{{BODY}}

      <tr><td style="height:30px; line-height:30px; font-size:0;">&nbsp;</td></tr>
      </table>

    </td></tr>

    <!-- footer -->
    <tr><td class="pad" style="padding:18px 32px 0 32px;">
      <p class="muted" style="margin:0; font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif; font-size:11.5px; line-height:1.7; color:#6b7280;">
        Claude Code のルーチンが毎朝 07:00 に自動生成しています。収集ルールと体裁の変更は
        <span style="font-family:'SFMono-Regular',Menlo,Consolas,monospace;">md/claude-code/routines/</span> を編集してください。
      </p>
    </td></tr>

  </table>

</td></tr>
</table>

</body>
</html>
