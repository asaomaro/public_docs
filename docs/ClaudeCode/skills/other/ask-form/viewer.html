<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
/* Markdown を整形して見せるページ（ask-form の成果物の枠の中に、隔離して出す）。marked で HTML にし、mermaid のコードは図にする。
   ライブラリは vendor/ に同梱したものを読む（外へは取りに行かない）。読めなければ、文字のまま出す。 */
:root{color-scheme:light dark;--bg:#fff;--fg:#1c2330;--muted:#667085;--line:#dfe3ea;--soft:#f3f5f8;--accent:#2f5fe0}
@media (prefers-color-scheme:dark){:root{--bg:#1a202a;--fg:#e7ecf4;--muted:#98a3b5;--line:#2b3442;--soft:#12161d;--accent:#7aa2ff}}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.75 "Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif}
#bar{position:sticky;top:0;z-index:2;display:flex;justify-content:flex-end;gap:6px;padding:6px 12px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(6px)}
#bar button{font:inherit;font-size:12px;padding:2px 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
#bar button[aria-pressed=true]{color:var(--fg);border-color:var(--accent);font-weight:700}
main{max-width:860px;margin:0 auto;padding:0 28px 60px;overflow-wrap:anywhere}
main>:first-child{margin-top:0}
h1,h2,h3,h4{line-height:1.35;margin:1.6em 0 .6em}
h1{font-size:1.7em;padding-bottom:.3em;border-bottom:1px solid var(--line)}
h2{font-size:1.35em;padding-bottom:.25em;border-bottom:1px solid var(--line)}
h3{font-size:1.15em}
p,ul,ol,blockquote,table,pre{margin:0 0 1em}
ul,ol{padding-left:1.6em}
li>p{margin:0 0 .4em}
a{color:var(--accent)}
blockquote{margin-left:0;padding:.1em 1em;border-left:4px solid var(--line);color:var(--muted)}
code{font:.9em ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;background:var(--soft);padding:.15em .4em;border-radius:5px}
pre{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:12px 14px;overflow:auto;line-height:1.55}
pre code{background:none;padding:0;font-size:.88em}
table{border-collapse:collapse;display:block;overflow:auto;max-width:100%}
th,td{border:1px solid var(--line);padding:6px 12px;text-align:left}
th{background:var(--soft)}
img{max-width:100%}
hr{border:0;border-top:1px solid var(--line);margin:1.6em 0}
input[type=checkbox]{margin-right:.4em}
.mermaid{margin:0 0 1em;text-align:center;overflow:auto}
.mermaid svg{max-width:100%;height:auto}
.mermaid-error{color:#b4540a;font-size:13px;margin:-.6em 0 1em}
#source{white-space:pre-wrap;tab-size:2;margin:0;border:0;border-radius:0;background:none;padding:0;font:13px/1.65 ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}
[hidden]{display:none !important}
</style>
</head>
<body>
<div id="bar"><button type="button" id="toggle" aria-pressed="false" hidden>ソースを見る</button></div>
<main><article id="doc"></article><pre id="source" hidden></pre></main>
<script>
const SOURCE = __SOURCE__;
const LIB = __LIB__;
const doc = document.getElementById('doc'), source = document.getElementById('source'), toggle = document.getElementById('toggle');
source.textContent = SOURCE;
function plain() { doc.hidden = true; source.hidden = false; toggle.hidden = true; }   // 整形できないときは、文字のまま
function load(name) {
  return new Promise((ok, ng) => {
    const s = document.createElement('script');
    s.src = LIB + name;
    s.onload = ok;
    s.onerror = () => ng(new Error(name + ' を読めません'));
    document.head.append(s);
  });
}
toggle.addEventListener('click', () => {
  const on = toggle.getAttribute('aria-pressed') !== 'true';
  toggle.setAttribute('aria-pressed', String(on));
  toggle.textContent = on ? '整形して見る' : 'ソースを見る';
  doc.hidden = on;
  source.hidden = !on;
});
async function diagrams() {
  const blocks = [...doc.querySelectorAll('pre > code.language-mermaid')];
  if (!blocks.length) return;
  await load('mermaid.min.js');   // 図があるときだけ読む（大きいので）
  mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'default' });
  for (let i = 0; i < blocks.length; i++) {
    const pre = blocks[i].parentNode;
    try {
      const { svg } = await mermaid.render('mmd' + i, blocks[i].textContent);
      const fig = document.createElement('div');
      fig.className = 'mermaid';
      fig.innerHTML = svg;
      pre.replaceWith(fig);
    } catch (e) {   // 描けない図は、コードのまま残して理由を添える
      const note = document.createElement('div');
      note.className = 'mermaid-error';
      note.textContent = '図にできませんでした: ' + String(e && e.message || e).split('\n')[0];
      pre.after(note);
      for (const junk of document.querySelectorAll('body > [id^="dmmd"], body > svg[id^="mmd"]')) junk.remove();
    }
  }
}
(async () => {
  try {
    await load('marked.umd.js');
    doc.innerHTML = marked.parse(SOURCE, { gfm: true });
    for (const a of doc.querySelectorAll('a[href]')) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    toggle.hidden = false;
  } catch (e) { plain(); return; }
  try { await diagrams(); } catch (e) {
    const note = document.createElement('div');
    note.className = 'mermaid-error';
    note.textContent = 'mermaid の図は、コードのまま出しています（' + (e && e.message || e) + '）';
    doc.prepend(note);
  }
  document.documentElement.dataset.ready = '1';
})();
</script>
</body>
</html>
