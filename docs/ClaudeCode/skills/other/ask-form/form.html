<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>質問</title>
<style>
/* 単独ウィンドウの殻。画面そのものは部品 <ask-form>（ask-form.js。ask.py が下に埋め込む）が描く。
   ここが受け持つのは、配色を渡す・通信・ウィンドウの大きさ合わせ・閉じること・質問の横に成果物を見せること（定義の view）。 */
:root{color-scheme:light dark}
html,body{margin:0;height:100%}
body{background:#f6f7f9;color:#1c2330;
  font:14px/1.6 "Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif}
ask-form{height:calc(100vh - var(--warn-h,0px));
  --ask-bg:#f6f7f9;--ask-card:#fff;--ask-fg:#1c2330;--ask-muted:#667085;--ask-border:#dfe3ea;
  --ask-accent:#2f5fe0;--ask-accent-soft:#edf2ff;--ask-accent-fg:#fff;--ask-error:#b4540a;--ask-warn:#b4540a}
@media (prefers-color-scheme:dark){
  body{background:#12161d;color:#e7ecf4}
  ask-form{--ask-bg:#12161d;--ask-card:#1a202a;--ask-fg:#e7ecf4;--ask-muted:#98a3b5;--ask-border:#2b3442;
    --ask-accent:#7aa2ff;--ask-accent-soft:#1e2a44;--ask-accent-fg:#0d1320;--ask-error:#f0a35a;--ask-warn:#f0a35a}
}
.end{padding:60px 22px;text-align:center;opacity:.7}
/* 成果物を見せる枠（定義に view があるとき）。左に成果物、右に質問。成果物の中身は部品に入れない（HTML は隔離した枠で出す） */
#app{height:calc(100vh - var(--warn-h,0px))}
body.has-view #app{display:flex}
body.has-view ask-form{flex:none;width:var(--form-w,430px);height:calc(100vh - var(--warn-h,0px));border-left:1px solid var(--line)}
/* 画像・音を出せなかった件数の固定の行（ask.py が決めた件数だけを数字で入れる。定義の文字は使わない） */
#warn{margin:0;padding:5px 14px;font-size:12.5px;background:#fff4e5;color:#b4540a;border-bottom:1px solid #f0d2a8}
@media (prefers-color-scheme:dark){#warn{background:#2a2216;color:#f0a35a;border-color:#4a3a22}}
#warn[hidden]{display:none}
#viewer{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;--line:#dfe3ea;--muted:#667085;--accent:#2f5fe0;--card:#fff}
#viewer[hidden],#tabs[hidden]{display:none}
#tabs{flex:none;display:flex;gap:4px;align-items:center;padding:8px 10px 0;border-bottom:1px solid var(--line);overflow-x:auto}
#tabs button{font:inherit;font-size:13px;padding:5px 12px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;background:none;
  color:var(--muted);cursor:pointer;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
#tabs button[aria-selected=true]{color:inherit;font-weight:700;background:var(--card);border-color:var(--line);margin-bottom:-1px}
#tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#stage{flex:1 1 auto;min-height:0;position:relative;background:var(--card)}
#stage>*{position:absolute;inset:0;width:100%;height:100%;border:0;margin:0}
#stage>[hidden]{display:none}
#stage iframe{background:#fff}
#stage pre{overflow:auto;padding:16px 20px;box-sizing:border-box;white-space:pre-wrap;overflow-wrap:anywhere;tab-size:2;
  font:13px/1.65 ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}
#stage .img{overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:16px;box-sizing:border-box}
#stage .img img{max-width:100%}
@media (prefers-color-scheme:dark){#viewer{--line:#2b3442;--muted:#98a3b5;--accent:#7aa2ff;--card:#1a202a}}
</style>
</head>
<body>
<p id="warn" data-ask-warnings hidden></p>
<div id="app">
<section id="viewer" hidden aria-label="成果物"><div id="tabs" role="tablist"></div><div id="stage"></div></section>
<ask-form id="form" tabindex="-1"></ask-form>
</div>
<script type="module">
__COMPONENT__
</script>
<script type="module">
const SPEC = __SPEC__;
const form = document.getElementById('form');
const base = location.pathname.replace(/[^/]*$/, '');
let finished = false, extra = null;

// ── 人が見ているかを受け口へ知らせる（操作が無いままなら、受け口が「人がいない」とみて閉じる） ──
(() => {
  let first = null, sent = false;
  const seen = () => { if (!sent) { sent = true; fetch(base + 'seen', { method: 'POST' }).catch(() => {}); } };
  // 開いた直後、止まったポインタの下で起きる動きの通知は数えない（位置が変わってはじめて操作とみる）
  addEventListener('pointermove', (e) => {
    if (!first) first = [e.screenX, e.screenY];
    else if (e.screenX !== first[0] || e.screenY !== first[1]) seen();
  });
  for (const t of ['pointerdown', 'keydown', 'wheel', 'touchstart']) addEventListener(t, seen, { passive: true });
})();

// ── 成果物を見せる（定義の view）──
// HTML は、隔離した枠（sandbox。同じ origin として扱わない）に、回答の受け口とは別の合言葉のアドレスから読む。
// 文字のファイルは文字として出す（HTML として解釈しない）。部品（<ask-form>）には何も入れない。
const VIEWS = Array.isArray(SPEC.view) ? SPEC.view : [];
const frames = [];
if (VIEWS.length) {
  document.body.classList.add('has-view');
  const viewer = document.getElementById('viewer'), tabs = document.getElementById('tabs'), stage = document.getElementById('stage');
  viewer.hidden = false;
  const show = (i) => {
    frames.forEach((f, k) => { f.hidden = k !== i; });
    [...tabs.children].forEach((b, k) => { b.setAttribute('aria-selected', k === i ? 'true' : 'false'); b.tabIndex = k === i ? 0 : -1; });
  };
  VIEWS.forEach((v, i) => {
    let node;
    if (v.kind === 'html' || v.kind === 'markdown') {   // Markdown は、整形して見せるページ（viewer.html）を同じ枠で読む
      node = document.createElement('iframe');
      node.setAttribute('sandbox', 'allow-scripts');   // スクリプトだけ。allow-popups（URL に本文を載せて外へ出せる）・allow-downloads は付けない（Sodashitsu の画面内の枠と同じ）
      node.referrerPolicy = 'no-referrer';
      node.title = v.title;
      node.src = SPEC._viewBase + v.src;
    } else if (v.kind === 'image') {
      node = document.createElement('div');
      node.className = 'img';
      const img = document.createElement('img');
      img.alt = v.title;
      img.src = SPEC._viewBase + v.src;
      node.append(img);
    } else {
      node = document.createElement('pre');
      node.tabIndex = 0;
      node.textContent = v.text;
    }
    node.dataset.view = String(i);
    stage.append(node);
    frames.push(node);
    const tab = document.createElement('button');
    tab.type = 'button';
    tab.setAttribute('role', 'tab');
    tab.textContent = v.title;
    tab.title = v.path || v.title;
    tab.addEventListener('click', () => show(i));
    tabs.append(tab);
  });
  tabs.hidden = VIEWS.length < 2;
  tabs.addEventListener('keydown', (e) => {   // タブは ←・→ で移る
    const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!d) return;
    const now = [...tabs.children].findIndex(b => b.getAttribute('aria-selected') === 'true'), to = (now + d + VIEWS.length) % VIEWS.length;
    show(to);
    tabs.children[to].focus();
  });
  show(0);
}

// ── 画像・音を出せなかった件数（固定の文。件数は数字だけ入れる）──
const warn = document.getElementById('warn');
{
  const img = Number(SPEC._mediaFailed) | 0, aud = Number(SPEC._audioSkipped) | 0, parts = [];
  if (img > 0) parts.push('画像 ' + img + ' 件を取得できませんでした（プレビューなしで出しています）');
  if (aud > 0) parts.push('外部 URL の音 ' + aud + ' 件は出せません');
  if (parts.length) {
    warn.textContent = parts.join('。');
    warn.hidden = false;
    document.documentElement.style.setProperty('--warn-h', Math.ceil(warn.getBoundingClientRect().height) + 'px');
  }
}

// ── 部品に定義を渡す ──
document.title = SPEC.title || '質問';
form.resolveMedia = (ref) => ref;   // 定義の画像・音は、ask.py が配るもの（file/N）か URL に書き換えてある
form.spec = SPEC;
form.focus();                        // キー（Ctrl+Enter・質問の移動）が最初から部品に届くように

// ── 送る・閉じる ──
function end(msg) {
  finished = true;
  window.close();
  // 閉じられない開き方（ふつうのタブ）だったときの表示
  setTimeout(() => {
    const d = document.createElement('div');
    d.className = 'end';
    d.textContent = msg + ' このウィンドウは閉じて構いません。';
    document.body.replaceChildren(d);
  }, 150);
}
form.addEventListener('ask-submit', async (e) => {
  if (finished) return;
  finished = true;
  form.busy = true;
  try {
    await fetch(base + 'answer', { method: 'POST', body: JSON.stringify(Object.assign({}, e.detail, extra || {})) });
    end('回答を受け取りました。');
  } catch (err) {
    finished = false;
    form.busy = false;
    form.notify('送れませんでした（受け取り側が終了しています）', true);
  }
});
async function cancel() {
  if (finished) return;
  finished = true;
  try { await fetch(base + 'cancel', { method: 'POST' }); } catch (e) {}
  end('キャンセルしました。');
}
form.addEventListener('ask-cancel', cancel);
// 部品が自分の用（拡大表示を閉じる・絞り込みを消す）で使わなかった Esc は、取り消し
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !e.defaultPrevented) { e.preventDefault(); cancel(); }
});

// 受け取り側が先に終わった（時間切れ・中断・人がいないと判断）ら、ウィンドウを残さない
const es = new EventSource(base + 'events');
es.onerror = async () => {
  if (finished) return;
  try { await fetch(base + 'ping'); } catch (e) { es.close(); end('受け付けは終了しました。'); }
};

// ── ウィンドウを中身の高さに合わせ、画面の中央へ ──
function fit(tries) {
  // 開いた直後は寸法がまだ決まっていないことがあるので、決まるまで待つ
  if (innerHeight < 80 || outerHeight < innerHeight) {
    if ((tries || 0) < 20) setTimeout(() => fit((tries || 0) + 1), 50);
    else form.relayout();   // 寸法が分からない開き方（ふつうのタブ）では、今の高さで目次を出すかを決める
    return;
  }
  try {
    const frame = outerHeight - innerHeight + (warn.hidden ? 0 : warn.offsetHeight);   // 固定の行の分も、枠と同じ扱い
    const cap = Math.min(SPEC._maxHeight || 820, screen.availHeight - 40);
    if (VIEWS.length) {   // 成果物を見せるときは、幅も高さも使えるだけ使う（中身に合わせて縮めない）
      const w = Math.min(SPEC._width || outerWidth, screen.availWidth - 20);
      resizeTo(w, cap);
      moveTo((screen.availLeft || 0) + (screen.availWidth - w) / 2, (screen.availTop || 0) + (screen.availHeight - cap) / 2);
      form.relayout();
      return;
    }
    form.style.height = (cap - frame) + 'px';   // 使える最大の高さで目次を出すかを決めてから、中身の高さに合わせて縮める
    form.relayout();
    const w = Math.min((SPEC._width || outerWidth) + form.indexWidth, screen.availWidth - 20);   // 目次が出たら、その分だけ幅を広げる
    const h = Math.min(form.contentHeight + frame + 2, cap);
    form.style.height = '';
    resizeTo(w, h);
    moveTo((screen.availLeft || 0) + (screen.availWidth - w) / 2, (screen.availTop || 0) + (screen.availHeight - h) / 2);
  } catch (e) {}
}
addEventListener('load', () => fit());
window.focus();
if (SPEC._auto) setTimeout(() => {
  extra = { _window: { w: outerWidth, h: outerHeight, iw: innerWidth, ih: innerHeight, sh: document.documentElement.scrollHeight, x: screenX, y: screenY,
                       focus: document.hasFocus(), pages: form.pageCount, views: frames.length, component: customElements.get('ask-form').version,
                       standalone: matchMedia('(display-mode: standalone)').matches || !window.menubar.visible } };
  form.submit();
}, 1200);
</script>
</body>
</html>
