# aidev CLI のテスト（sh 実装・ps1 実装・両者のパリティ）
#
# なぜ CI が要るか:
#   `aidev` と `aidev.ps1` は**同じ挙動でなければならない**が、片方の処理系が無い環境では
#   パリティテストが skip される。skip はそのまま**未検証の穴**で、実際この穴の裏に
#   ps1 の実バグ2件とテスト自身のバグ2件が「緑のまま」隠れていた。
#   だから CI では **skip=0 を満たせる環境**で走らせ、skip が出たら落とす。
#   同じ理由で **awk の実装差**も CI でしか出ない（開発機は mawk、ubuntu は gawk）。
#   `-v` のエスケープと POSIX 文字クラスのロケール依存で、実際に 57 件と 2 件の fail を出した。
#
# 走らせる環境:
# 文書も対象に含める理由:
#   `test/lint-docs.sh` が**文書と CLI 表面の整合**（参照の健全性・重複文・読み込み量の予算）を
#   検査する。bin/** だけをトリガにすると、文書だけを変えた PR で lint が走らず、
#   「片方だけ直して食い違う」——このセッションで3回起きた形——が素通りする。
#
# 走らせる環境:
#   ubuntu  … pwsh 7 が入っている（PowerShell 7 系のパリティ）
#   windows … Git Bash の sh ＋ **Windows PowerShell 5.1**。ps1 の本来の対象で、
#             ここが緑でないと「Windows で動く」と言えない
name: aidev CLI

on:
  push:
    paths:
      - 'docs/ClaudeCode/skills/aidev/**'
      - '.github/workflows/aidev-cli.yml'
  pull_request:
    paths:
      - 'docs/ClaudeCode/skills/aidev/**'
      - '.github/workflows/aidev-cli.yml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu には pwsh 7 が入っている（PowerShell 7 系のパリティ）
          - os: ubuntu-latest
            ps_host: pwsh
          # windows-latest には pwsh 7 と Windows PowerShell 5.1 の**両方**が入っている。
          # run.sh の自動判定は pwsh を優先するので、放っておくと **ps1 の本来の対象である
          # 5.1 が一度も走らない**。両方を明示的に回す。
          - os: windows-latest
            ps_host: pwsh
          - os: windows-latest
            ps_host: winps
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.ps_host }}
    defaults:
      run:
        shell: bash
        working-directory: docs/ClaudeCode/skills/aidev/aidev-docs/bin
    steps:
      - uses: actions/checkout@v4
        with:
          # harnessRev は HEAD の tree hash なので履歴は要らないが、浅い clone での挙動差を
          # 避けるため全履歴を取る（テストの squash 不変性検査は自前の一時リポジトリで行う）
          fetch-depth: 0

      - name: 処理系の確認
        run: |
          echo "sh: $(sh --version 2>&1 | head -n1)"
          command -v pwsh       && pwsh -v       || echo "pwsh: なし"
          command -v powershell && echo "powershell(5.1): あり" || echo "powershell: なし"

      - name: pwsh が無ければ入れる
        if: matrix.ps_host == 'pwsh'
        run: |
          command -v pwsh >/dev/null 2>&1 && exit 0
          sh test/setup-pwsh.sh
          echo "$HOME/.cache/aidev-pwsh" >> "$GITHUB_PATH"

      # 診断（原因が分かって直ったら外す）: 本物の checkout で ps1 の harness_rev が unknown になる条件を絞る。
      # 同じ本物の checkout を、(a) git 管理下の cwd (b) git 管理外の cwd (c) run.sh と同じ呼び方
      # （MSYS2_ARG_CONV_EXCL・cygpath -w・sh で new した work がある）で動かし、各 case の harnessRev note の有無と理由を出す。
      # テストより先に走らせ、失敗してもテストは走らせる
      - name: 診断（harness_rev・winps）
        if: matrix.ps_host == 'winps'
        continue-on-error: true
        run: |
          H="$(pwd)"
          echo "--- git: $(git --version)"
          diag() { # label cwd mode
            echo "=== case $1 (cwd=$2)"
            cd "$2"
            for dbg in "" 1; do   # "" は通常の経路（テストと同じ）、1 は診断の経路
              if [ "$3" = run ]; then
                AIDEV_DEBUG_HARNESS_REV=$dbg MSYS2_ARG_CONV_EXCL='*' powershell -NoProfile -ExecutionPolicy Bypass -File "$(cygpath -w "$H/aidev.ps1")" doctor 2>&1 | tr -d '\r' > "$RUNNER_TEMP/diag.out" || true
              else
                AIDEV_DEBUG_HARNESS_REV=$dbg powershell -NoProfile -ExecutionPolicy Bypass -File "$H/aidev.ps1" doctor 2>&1 | tr -d '\r' > "$RUNNER_TEMP/diag.out" || true
              fi
              if grep -q "git 管理下にない" "$RUNNER_TEMP/diag.out"; then echo "RESULT[debug=${dbg:-0}]: harness_rev=unknown"; else echo "RESULT[debug=${dbg:-0}]: harness_rev=ok"; fi
            done
            grep -E "^\[harness_rev\]" "$RUNNER_TEMP/diag.out" | cut -c1-700 | head -40
          }
          A="$RUNNER_TEMP/dg-a"; mkdir -p "$A/.aidev/works"; (cd "$A" && git init -q .)
          B="$RUNNER_TEMP/dg-b"; mkdir -p "$B/.aidev/works"
          C=$(mktemp -d); mkdir -p "$C/.aidev/backlog"; (cd "$C" && sh "$H/aidev" new pboot >/dev/null 2>&1) || true
          # run.sh の 98 行と同じく TMP を mktemp -d で上書きした文脈（git init しない PJ）で動かす
          echo "--- 親の TMP=$TMP TEMP=$TEMP"
          export TMP=$(mktemp -d)
          echo "--- 上書き後の TMP=$TMP"
          powershell -NoProfile -Command '"child TMP=" + $env:TMP + " TEMP=" + $env:TEMP + " GetTempPath=" + [IO.Path]::GetTempPath() + " exists=" + (Test-Path ([IO.Path]::GetTempPath()))' 2>&1 | tr -d '\r'
          diag a-repo "$A" plain
          diag b-nonrepo "$B" plain
          diag c-runsh-like "$C" run
          cd "$H"

      - name: テスト（skip が残っていたら落とす）
        # run.sh 自体は skip があっても exit 0 で終わる（開発者の手元では処理系が無いこともあり、
        # そこで落とすと手元のテストが回らなくなる）。CI は処理系を揃えられる場所なので、
        # **ここでだけ skip>0 を失敗として扱う**。そうしないと「CI が緑」と
        # 「ps1 が検証された」が別物のまま、誰も気付けない。
        # GitHub の bash は既定で `-eo pipefail` なので、テストが落ちればこの時点で止まる。
        # 以降に来るのは「テストは緑」の場合だけ
        env:
          # 処理系を明示する。自動判定に任せると windows でも常に pwsh が選ばれ、
          # 5.1 の経路が検証されないまま緑になる
          AIDEV_PS_HOST: ${{ matrix.ps_host }}
        run: |
          sh test/run.sh 2>&1 | tee result.txt
          skip=$(sed -n 's/^RESULT:.*skip=\([0-9][0-9]*\).*/\1/p' result.txt)
          rm -f result.txt
          if [ -z "$skip" ]; then
            echo "::error::RESULT 行が読めませんでした（テストが最後まで走っていない可能性）"
            exit 1
          fi
          if [ "$skip" -ne 0 ]; then
            echo "::error::skip=$skip（未検証の穴が残っています。処理系が揃っているか確認してください）"
            exit 1
          fi

      # Sodashitsu のプラグインアプリ（aidev-docs/soda-plugin）の単体テスト。
      # Node 標準ライブラリだけで書いてあり、OS 差の検証は要らないので ubuntu でだけ流す
      # （sodactl が PATH に無いので、pack の確認は skip になる。それ以外は偽の sodactl・偽のホストで走る）
      - name: Node を用意する（プラグイン用）
        if: matrix.os == 'ubuntu-latest' && matrix.ps_host == 'pwsh'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: プラグインの単体テスト（node --test）
        if: matrix.os == 'ubuntu-latest' && matrix.ps_host == 'pwsh'
        working-directory: docs/ClaudeCode/skills/aidev/aidev-docs/soda-plugin
        run: node --test
